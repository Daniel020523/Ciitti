<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Support</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#14213d}
.card{max-width:460px;margin:50px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 12px 35px #0001}
h1{margin-top:0}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff1c2;color:#7a5500;font-size:12px;font-weight:700}
button,.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#173b72;color:white;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;font-family:inherit;font-size:14px}
.muted{color:#65748b;line-height:1.55}
@media(max-width:520px){.card{margin:20px 12px}}

/* overlay + chat modal */
.overlay{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:0;z-index:50}
.overlay.open{display:flex}
.modal{background:white;border-radius:18px;max-width:420px;width:100%;height:85vh;max-height:680px;box-shadow:0 20px 50px #0003;display:flex;flex-direction:column;overflow:hidden}
@media(max-width:520px){.modal{border-radius:0;height:100dvh;max-height:none;max-width:none}.overlay{padding:0}}

.chat-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e8edf4;flex-shrink:0}
.chat-header .close{background:none;border:0;color:#173b72;font-size:14px;font-weight:700;padding:0;width:auto;cursor:pointer}
.chat-header .chat-title{font-weight:700;font-size:15px}
.chat-header .sub{font-size:12px;color:#77859a;font-weight:400}

.messages{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#eef2f8}
.messages .empty{text-align:center;color:#8493a8;font-size:13px;margin:auto;padding:20px}
.bubble{max-width:78%;padding:9px 12px;border-radius:15px;font-size:14px;line-height:1.42;word-wrap:break-word}
.bubble.me{align-self:flex-end;background:#173b72;color:white;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:white;color:#14213d;border:1px solid #e1e7f0;border-bottom-left-radius:4px}
.bubble-text{white-space:pre-wrap}
.bubble-img{display:block;max-width:100%;border-radius:10px;margin-bottom:4px;cursor:pointer}
.bubble-time{font-size:10px;opacity:.6;margin-top:3px;text-align:right}

.input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #e8edf4;flex-shrink:0;background:white;align-items:center}
.input-row input[type="text"]{flex:1;padding:11px 13px;border:1px solid #ccd5e2;border-radius:20px;font-family:inherit;font-size:16px;min-width:0}
.input-row button{width:auto;padding:0 18px;border-radius:20px;flex-shrink:0}
.input-row button:disabled{opacity:.6;cursor:default}
.icon-btn{width:38px;height:38px;padding:0;border-radius:50%;background:#e8edf4;color:#173b72;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:disabled{opacity:.6;cursor:default}

/* typing indicator */
.typing-bubble{align-self:flex-start;background:white;border:1px solid #e1e7f0;border-bottom-left-radius:4px;padding:11px 14px;border-radius:15px;display:flex;gap:4px;width:fit-content}
.typing-dot{width:6px;height:6px;border-radius:50%;background:#9aa8bd;animation:typingBounce 1.2s infinite ease-in-out}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
</style></head><body>

<main class="card" id="landing"><h1>Customer support</h1><p class="muted">Send us a message and we'll get back to you.</p><button onclick="openChat()">Start a chat</button></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="chat-header">
      <button class="close" onclick="closeChat()">&larr; Close</button>
      <div>
        <div class="chat-title">Support chat</div>
        <div class="sub">We usually reply within a few minutes</div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
      <button type="button" class="icon-btn" id="imageBtn" onclick="document.getElementById('imageInput').click()" title="Send an image">📎</button>
      <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off">
      <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://rgtbqipsdebekzznswll.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QF5lXikZj0cRv1sipEFtyg_zqjw0eW1";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Storage bucket used for chat image attachments.
const IMAGE_BUCKET = 'chat-images';

// There is a single shared conversation for this widget (no per-visitor / per-device
// identity, no login). Whoever opens the chat, on whatever device, sees the same thread.
let conversationId = null;
let msgChannel = null;

// Typing indicator is a lightweight broadcast channel, independent of the DB and of
// whether a conversation row exists yet, since there's only ever one conversation.
const TYPING_CHANNEL_NAME = 'support-typing';
let typingChannel = null;
let typingHideTimer = null;
let lastTypingSentAt = 0;

document.getElementById('msgInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput').addEventListener('input', () => {
  sendTypingBroadcast();
});

function setupTypingChannel(){
  if(typingChannel) return;
  typingChannel = sb.channel(TYPING_CHANNEL_NAME, { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'typing' }, (msg) => {
      if(msg.payload && msg.payload.sender === 'admin'){
        showTypingIndicator();
      }
    })
    .subscribe();
}

function sendTypingBroadcast(){
  if(!typingChannel) return;
  const now = Date.now();
  if(now - lastTypingSentAt < 1200) return; // throttle
  lastTypingSentAt = now;
  typingChannel.send({ type: 'broadcast', event: 'typing', payload: { sender: 'user' } });
}

function showTypingIndicator(){
  const container = document.getElementById('messages');
  let el = document.getElementById('typingIndicator');
  if(!el){
    el = document.createElement('div');
    el.id = 'typingIndicator';
    el.className = 'typing-bubble';
    el.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    container.appendChild(el);
  }
  scrollToBottom();
  clearTimeout(typingHideTimer);
  typingHideTimer = setTimeout(hideTypingIndicator, 2500);
}

function hideTypingIndicator(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function scrollToBottom(){
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function appendMessage(m, doScroll){
  hideTypingIndicator();
  const container = document.getElementById('messages');
  const emptyEl = container.querySelector('.empty');
  if(emptyEl) emptyEl.remove();
  const div = document.createElement('div');
  div.className = 'bubble ' + (m.sender === 'user' ? 'me' : 'them');
  let inner = '';
  if(m.image_url){
    inner += `<img class="bubble-img" src="${escapeHtml(m.image_url)}" alt="Sent image" onclick="window.open('${escapeHtml(m.image_url)}','_blank')">`;
  }
  if(m.message){
    inner += `<div class="bubble-text">${escapeHtml(m.message)}</div>`;
  }
  inner += `<div class="bubble-time">${fmtTime(m.created_at)}</div>`;
  div.innerHTML = inner;
  container.appendChild(div);
  if(doScroll !== false) scrollToBottom();
}

// Finds the one shared conversation, if it has been created yet.
async function findSharedConversation(){
  const { data, error } = await sb
    .from('conversations')
    .select('*')
    .order('created_at', { ascending: true })
    .limit(1)
    .maybeSingle();
  if(error){ console.error(error); return null; }
  return data;
}

async function loadMessages(){
  const container = document.getElementById('messages');
  container.innerHTML = '<div class="empty">Loading...</div>';
  const { data, error } = await sb
    .from('chat_messages')
    .select('*')
    .eq('conversation_id', conversationId)
    .order('created_at', { ascending: true });

  if(error){
    container.innerHTML = '<div class="empty">Failed to load messages.</div>';
    console.error(error);
    return;
  }
  container.innerHTML = '';
  if(!data.length){
    container.innerHTML = '<div class="empty">Say hello to start the conversation.</div>';
  } else {
    data.forEach(m => appendMessage(m, false));
  }
  scrollToBottom();
}

function subscribeRealtime(){
  if(msgChannel) return;
  msgChannel = sb.channel('support-chat-' + conversationId)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'chat_messages',
      filter: `conversation_id=eq.${conversationId}`
    }, (payload) => {
      appendMessage(payload.new);
    })
    .subscribe();
}

async function openChat(){
  document.getElementById('overlay').classList.add('open');
  document.getElementById('msgInput').value = '';
  document.getElementById('messages').innerHTML = '<div class="empty">Loading...</div>';

  setupTypingChannel();

  const existing = await findSharedConversation();
  if(existing){
    conversationId = existing.id;
    await loadMessages();
    subscribeRealtime();
  } else {
    conversationId = null;
    document.getElementById('messages').innerHTML = '<div class="empty">Say hello to start the conversation.</div>';
  }

  setTimeout(() => document.getElementById('msgInput').focus(), 100);
}

function closeChat(){
  document.getElementById('overlay').classList.remove('open');
}

async function ensureConversation(){
  if(conversationId) return conversationId;

  // Re-check in case another device created it moments ago.
  const existing = await findSharedConversation();
  if(existing){
    conversationId = existing.id;
    subscribeRealtime();
    return conversationId;
  }

  const { data, error } = await sb
    .from('conversations')
    .insert({})
    .select()
    .single();

  if(error){
    console.error(error);
    return null;
  }

  conversationId = data.id;
  subscribeRealtime();
  return conversationId;
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  const cid = await ensureConversation();
  if(!cid){
    btn.disabled = false;
    alert('Something went wrong. Please try again.');
    return;
  }

  const { error } = await sb.from('chat_messages').insert({
    conversation_id: cid,
    sender: 'user',
    message: text
  });

  if(error){
    console.error(error);
    btn.disabled = false;
    alert('Message failed to send. Please try again.');
    return;
  }

  await sb.from('conversations').update({
    last_message_at: new Date().toISOString(),
    status: 'open'
  }).eq('id', cid);

  input.value = '';
  btn.disabled = false;
  input.focus();
}

async function handleImageSelect(e){
  const file = e.target.files[0];
  e.target.value = ''; // allow re-selecting the same file later
  if(!file) return;
  if(!file.type.startsWith('image/')){
    alert('Please choose an image file.');
    return;
  }
  await sendImageMessage(file);
}

async function sendImageMessage(file){
  const imgBtn = document.getElementById('imageBtn');
  const sendBtn = document.getElementById('sendBtn');
  imgBtn.disabled = true;
  sendBtn.disabled = true;

  const cid = await ensureConversation();
  if(!cid){
    imgBtn.disabled = false;
    sendBtn.disabled = false;
    alert('Something went wrong. Please try again.');
    return;
  }

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${cid}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

  const { error: uploadError } = await sb.storage.from(IMAGE_BUCKET).upload(path, file, {
    contentType: file.type || 'image/jpeg'
  });

  if(uploadError){
    console.error(uploadError);
    imgBtn.disabled = false;
    sendBtn.disabled = false;
    alert('Image failed to upload. Please try again.');
    return;
  }

  const { data: urlData } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);

  const { error } = await sb.from('chat_messages').insert({
    conversation_id: cid,
    sender: 'user',
    message: '',
    image_url: urlData.publicUrl
  });

  if(error){
    console.error(error);
    imgBtn.disabled = false;
    sendBtn.disabled = false;
    alert('Image failed to send. Please try again.');
    return;
  }

  await sb.from('conversations').update({
    last_message_at: new Date().toISOString(),
    status: 'open'
  }).eq('id', cid);

  imgBtn.disabled = false;
  sendBtn.disabled = false;
}
</script>
</body></html>
