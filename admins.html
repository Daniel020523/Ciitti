<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Admin — Demo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#14213d}
.wrap{max-width:720px;margin:0 auto;padding:0 0 0 0;height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 16px;gap:12px;flex-wrap:wrap;flex-shrink:0}
h1{margin:0;font-size:20px}.muted{color:#65748b;line-height:1.55;font-size:13px}
button{border:0;border-radius:10px;background:#173b72;color:white;font-weight:700;cursor:pointer;padding:10px 16px;font-family:inherit;font-size:14px}
button.secondary{background:#e8edf4;color:#173b72}

.login-wrap{max-width:340px;margin:80px auto;background:white;border-radius:14px;padding:26px;box-shadow:0 8px 22px #0001}
.login-wrap h1{font-size:20px;margin-top:0}
.login-wrap input{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #ccd5e2;border-radius:10px;font-size:14px}
.login-err{color:#b3261e;font-size:13px;margin:-6px 0 10px;min-height:16px}

/* conversation list */
.list{flex:1;min-height:0;overflow-y:auto;padding:0 12px 12px}
.empty{text-align:center;color:#77859a;padding:40px 0}
.conv-item{background:white;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 6px 16px #0001;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.conv-item:active{background:#f4f7fb}
.conv-name{font-weight:700;font-size:14px}
.conv-preview{font-size:12px;color:#77859a;margin-top:2px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-right{text-align:right;flex-shrink:0}
.conv-time{font-size:11px;color:#8493a8;margin-bottom:6px}
.status-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.status-tag.open{background:#fff1c2;color:#7a5500}
.status-tag.replied{background:#d9f2e3;color:#1a7f4e}

/* thread view */
.thread{display:none;flex-direction:column;height:100vh}
.thread.open{display:flex}
.thread-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e8edf4;flex-shrink:0;background:white}
.thread-header .back{background:none;border:0;color:#173b72;font-size:14px;font-weight:700;padding:0;width:auto;cursor:pointer}
.thread-header .thread-name{font-weight:700;font-size:15px}
.thread-header .thread-status{font-size:12px;color:#77859a}

.messages{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#eef2f8}
.messages .empty{margin:auto}
.bubble{max-width:78%;padding:9px 12px;border-radius:15px;font-size:14px;line-height:1.42;word-wrap:break-word}
.bubble.me{align-self:flex-end;background:#173b72;color:white;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:white;color:#14213d;border:1px solid #e1e7f0;border-bottom-left-radius:4px}
.bubble-text{white-space:pre-wrap}
.bubble-time{font-size:10px;opacity:.6;margin-top:3px;text-align:right}

.input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #e8edf4;flex-shrink:0;background:white}
.input-row input{flex:1;padding:11px 13px;border:1px solid #ccd5e2;border-radius:20px;font-family:inherit;font-size:14px;min-width:0}
.input-row button{width:auto;padding:0 18px;border-radius:20px;flex-shrink:0}
.input-row button:disabled{opacity:.6;cursor:default}
</style></head><body>

<div class="login-wrap" id="loginWrap">
  <h1>Admin login</h1>
  <input id="loginEmail" type="email" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <div class="login-err" id="loginErr"></div>
  <button onclick="login()" id="loginBtn" style="width:100%">Log in</button>
</div>

<div class="wrap" id="appWrap" style="display:none">
  <div class="top">
    <div>
      <h1>Conversations</h1>
      <p class="muted" id="whoami" style="margin:2px 0 0"></p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="secondary" onclick="loadConversations()">Refresh</button>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="thread" id="threadView">
  <div class="thread-header">
    <button class="back" onclick="closeThread()">&larr; Back</button>
    <div>
      <div class="thread-name" id="threadName"></div>
      <div class="thread-status" id="threadStatus"></div>
    </div>
  </div>
  <div class="messages" id="threadMessages"></div>
  <div class="input-row">
    <input id="replyInput" type="text" placeholder="Type a reply..." autocomplete="off">
    <button onclick="sendReply()" id="replyBtn">Send</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://rgtbqipsdebekzznswll.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QF5lXikZj0cRv1sipEFtyg_zqjw0eW1";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let convChannel = null;
let msgChannel = null;
let currentConvId = null;
let currentConvName = '';
let conversationsCache = [];

document.getElementById('replyInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); sendReply(); }
});

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Log in';

  if(error){
    errEl.textContent = 'Invalid email or password.';
    return;
  }
  showApp(data.user);
}

async function logout(){
  if(convChannel){ sb.removeChannel(convChannel); convChannel = null; }
  if(msgChannel){ sb.removeChannel(msgChannel); msgChannel = null; }
  await sb.auth.signOut();
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('threadView').classList.remove('open');
  document.getElementById('loginWrap').style.display = 'block';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

function showApp(user){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display = 'flex';
  document.getElementById('whoami').textContent = 'Logged in as ' + user.email;
  loadConversations();
  subscribeConversations();
}

(async () => {
  const { data } = await sb.auth.getSession();
  if(data.session){
    showApp(data.session.user);
  }
})();

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString();
}
function fmtShortTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

async function loadConversations(){
  const list = document.getElementById('list');
  const { data, error } = await sb
    .from('conversations')
    .select('*')
    .order('last_message_at', { ascending: false });

  if(error){
    list.innerHTML = '<p class="muted">Failed to load conversations.</p>';
    console.error(error);
    return;
  }

  conversationsCache = data;

  if(!data.length){
    list.innerHTML = '<div class="empty">No conversations yet.</div>';
    return;
  }

  list.innerHTML = data.map(c => `
    <div class="conv-item" onclick="openThread('${c.id}')">
      <div>
        <div class="conv-name">${escapeHtml(c.name || 'Anonymous')}</div>
      </div>
      <div class="conv-right">
        <div class="conv-time">${fmtShortTime(c.last_message_at)}</div>
        <span class="status-tag ${c.status === 'replied' ? 'replied' : 'open'}">${c.status === 'replied' ? 'Replied' : 'Open'}</span>
      </div>
    </div>
  `).join('');
}

function subscribeConversations(){
  if(convChannel) return;
  convChannel = sb.channel('admin-conversations')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'conversations' }, () => {
      loadConversations();
    })
    .subscribe();
}

function scrollThreadToBottom(){
  const c = document.getElementById('threadMessages');
  c.scrollTop = c.scrollHeight;
}

function appendThreadMessage(m, doScroll){
  const container = document.getElementById('threadMessages');
  const emptyEl = container.querySelector('.empty');
  if(emptyEl) emptyEl.remove();
  const div = document.createElement('div');
  div.className = 'bubble ' + (m.sender === 'admin' ? 'me' : 'them');
  div.innerHTML = `<div class="bubble-text">${escapeHtml(m.message)}</div><div class="bubble-time">${fmtShortTime(m.created_at)}</div>`;
  container.appendChild(div);
  if(doScroll !== false) scrollThreadToBottom();
}

async function loadThreadMessages(convId){
  const container = document.getElementById('threadMessages');
  container.innerHTML = '<div class="empty">Loading...</div>';
  const { data, error } = await sb
    .from('chat_messages')
    .select('*')
    .eq('conversation_id', convId)
    .order('created_at', { ascending: true });

  if(error){
    container.innerHTML = '<div class="empty">Failed to load messages.</div>';
    console.error(error);
    return;
  }
  container.innerHTML = '';
  if(!data.length){
    container.innerHTML = '<div class="empty">No messages yet.</div>';
  } else {
    data.forEach(m => appendThreadMessage(m, false));
  }
  scrollThreadToBottom();
}

function subscribeThreadMessages(convId){
  if(msgChannel){ sb.removeChannel(msgChannel); msgChannel = null; }
  msgChannel = sb.channel('admin-thread-' + convId)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'chat_messages',
      filter: `conversation_id=eq.${convId}`
    }, (payload) => {
      appendThreadMessage(payload.new);
    })
    .subscribe();
}

async function openThread(convId){
  currentConvId = convId;
  const conv = conversationsCache.find(c => c.id === convId);
  currentConvName = conv ? (conv.name || 'Anonymous') : 'Conversation';

  document.getElementById('threadName').textContent = currentConvName;
  document.getElementById('threadStatus').textContent = conv && conv.status === 'replied' ? 'Replied' : 'Open';
  document.getElementById('replyInput').value = '';
  document.getElementById('threadView').classList.add('open');

  await loadThreadMessages(convId);
  subscribeThreadMessages(convId);
  setTimeout(() => document.getElementById('replyInput').focus(), 100);
}

function closeThread(){
  document.getElementById('threadView').classList.remove('open');
  if(msgChannel){ sb.removeChannel(msgChannel); msgChannel = null; }
  currentConvId = null;
  loadConversations();
}

async function sendReply(){
  if(!currentConvId) return;
  const input = document.getElementById('replyInput');
  const text = input.value.trim();
  if(!text) return;

  const btn = document.getElementById('replyBtn');
  btn.disabled = true;

  const { error } = await sb.from('chat_messages').insert({
    conversation_id: currentConvId,
    sender: 'admin',
    message: text
  });

  if(error){
    console.error(error);
    btn.disabled = false;
    alert('Failed to send reply.');
    return;
  }

  await sb.from('conversations').update({
    last_message_at: new Date().toISOString(),
    status: 'replied'
  }).eq('id', currentConvId);

  document.getElementById('threadStatus').textContent = 'Replied';
  input.value = '';
  btn.disabled = false;
  input.focus();
}
</script>
</body></html>
