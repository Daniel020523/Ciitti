<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Support Admin — Demo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#14213d}
.wrap{max-width:720px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
h1{margin:0;font-size:20px}.muted{color:#65748b;line-height:1.55;font-size:13px}
button{border:0;border-radius:10px;background:#173b72;color:white;font-weight:700;cursor:pointer;padding:10px 16px;font-family:inherit;font-size:14px}
button.secondary{background:#e8edf4;color:#173b72}

.login-wrap{max-width:340px;margin:80px auto;background:white;border-radius:14px;padding:26px;box-shadow:0 8px 22px #0001}
.login-wrap h1{font-size:20px;margin-top:0}
.login-wrap input{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #ccd5e2;border-radius:10px;font-size:16px}
.login-err{color:#b3261e;font-size:13px;margin:-6px 0 10px;min-height:16px}

.status-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.status-tag.open{background:#fff1c2;color:#7a5500}
.status-tag.replied{background:#d9f2e3;color:#1a7f4e}

/* chat view */
.chat-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e8edf4;flex-shrink:0;background:white}
.chat-header .chat-title{font-weight:700;font-size:15px}
.chat-header .sub{font-size:12px;color:#77859a}

.messages{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#eef2f8}
.messages .empty{margin:auto;text-align:center;color:#8493a8;font-size:13px;padding:20px}
.bubble{max-width:78%;padding:9px 12px;border-radius:15px;font-size:14px;line-height:1.42;word-wrap:break-word}
.bubble.me{align-self:flex-end;background:#173b72;color:white;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:white;color:#14213d;border:1px solid #e1e7f0;border-bottom-left-radius:4px}
.bubble-text{white-space:pre-wrap}
.bubble-img{display:block;max-width:100%;border-radius:10px;margin-bottom:4px;cursor:pointer}
.bubble-time{font-size:10px;opacity:.6;margin-top:3px;text-align:right}

.input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #e8edf4;flex-shrink:0;background:white;align-items:center}
.input-row input[type="text"]{flex:1;padding:11px 13px;border:1px solid #ccd5e2;border-radius:20px;font-family:inherit;font-size:16px;min-width:0}
.input-row button{width:auto;padding:0 18px;border-radius:20px;flex-shrink:0}
.input-row button:disabled{opacity:.6;cursor:default}
.icon-btn{width:38px;height:38px;padding:0;border-radius:50%;background:#e8edf4;color:#173b72;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:disabled{opacity:.6;cursor:default}

/* typing indicator */
.typing-bubble{align-self:flex-start;background:white;border:1px solid #e1e7f0;border-bottom-left-radius:4px;padding:11px 14px;border-radius:15px;display:flex;gap:4px;width:fit-content}
.typing-dot{width:6px;height:6px;border-radius:50%;background:#9aa8bd;animation:typingBounce 1.2s infinite ease-in-out}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
</style></head><body>

<div class="login-wrap" id="loginWrap">
  <h1>Admin login</h1>
  <input id="loginEmail" type="email" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <div class="login-err" id="loginErr"></div>
  <button onclick="login()" id="loginBtn" style="width:100%">Log in</button>
</div>

<div class="wrap" id="appWrap" style="display:none">
  <div class="chat-header">
    <div>
      <div class="chat-title">Support chat</div>
      <div class="sub" id="whoami"></div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <span class="status-tag" id="statusTag" style="display:none">Open</span>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-row">
    <input type="file" id="replyImageInput" accept="image/*" style="display:none" onchange="handleReplyImageSelect(event)">
    <button type="button" class="icon-btn" id="replyImageBtn" onclick="document.getElementById('replyImageInput').click()" title="Send an image" disabled>📎</button>
    <input id="replyInput" type="text" placeholder="Waiting for a customer message..." autocomplete="off" disabled>
    <button onclick="sendReply()" id="replyBtn" disabled>Send</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://rgtbqipsdebekzznswll.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QF5lXikZj0cRv1sipEFtyg_zqjw0eW1";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Storage bucket used for chat image attachments.
const IMAGE_BUCKET = 'chat-images';

// There is a single shared conversation across the whole widget, so the admin goes
// straight into that thread on login — no list to click through.
let conversationId = null;
let convWatchChannel = null;
let msgChannel = null;

// Typing indicator: broadcast-only channel, shared with the customer widget.
const TYPING_CHANNEL_NAME = 'support-typing';
let typingChannel = null;
let typingHideTimer = null;
let lastTypingSentAt = 0;

document.getElementById('replyInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); sendReply(); }
});
document.getElementById('replyInput').addEventListener('input', () => {
  sendTypingBroadcast();
});

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Log in';

  if(error){
    errEl.textContent = 'Invalid email or password.';
    return;
  }
  showApp(data.user);
}

async function logout(){
  if(convWatchChannel){ sb.removeChannel(convWatchChannel); convWatchChannel = null; }
  if(msgChannel){ sb.removeChannel(msgChannel); msgChannel = null; }
  if(typingChannel){ sb.removeChannel(typingChannel); typingChannel = null; }
  conversationId = null;
  await sb.auth.signOut();
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'block';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

async function showApp(user){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display = 'flex';
  document.getElementById('whoami').textContent = 'Logged in as ' + user.email;

  setupTypingChannel();
  await connectToConversation();
  subscribeConversationWatch();
}

(async () => {
  const { data } = await sb.auth.getSession();
  if(data.session){
    showApp(data.session.user);
  }
})();

// Typing indicator ---------------------------------------------------------

function setupTypingChannel(){
  if(typingChannel) return;
  typingChannel = sb.channel(TYPING_CHANNEL_NAME, { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'typing' }, (msg) => {
      if(msg.payload && msg.payload.sender === 'user'){
        showTypingIndicator();
      }
    })
    .subscribe();
}

function sendTypingBroadcast(){
  if(!typingChannel || !conversationId) return;
  const now = Date.now();
  if(now - lastTypingSentAt < 1200) return; // throttle
  lastTypingSentAt = now;
  typingChannel.send({ type: 'broadcast', event: 'typing', payload: { sender: 'admin' } });
}

function showTypingIndicator(){
  const container = document.getElementById('messages');
  let el = document.getElementById('typingIndicator');
  if(!el){
    el = document.createElement('div');
    el.id = 'typingIndicator';
    el.className = 'typing-bubble';
    el.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    container.appendChild(el);
  }
  scrollToBottom();
  clearTimeout(typingHideTimer);
  typingHideTimer = setTimeout(hideTypingIndicator, 2500);
}

function hideTypingIndicator(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

// Message rendering ----------------------------------------------------

function fmtShortTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}
function scrollToBottom(){
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function appendMessage(m, doScroll){
  hideTypingIndicator();
  const container = document.getElementById('messages');
  const emptyEl = container.querySelector('.empty');
  if(emptyEl) emptyEl.remove();
  const div = document.createElement('div');
  div.className = 'bubble ' + (m.sender === 'admin' ? 'me' : 'them');
  let inner = '';
  if(m.image_url){
    inner += `<img class="bubble-img" src="${escapeHtml(m.image_url)}" alt="Sent image" onclick="window.open('${escapeHtml(m.image_url)}','_blank')">`;
  }
  if(m.message){
    inner += `<div class="bubble-text">${escapeHtml(m.message)}</div>`;
  }
  inner += `<div class="bubble-time">${fmtShortTime(m.created_at)}</div>`;
  div.innerHTML = inner;
  container.appendChild(div);
  if(doScroll !== false) scrollToBottom();
}

// Conversation / message loading ---------------------------------------

function updateStatusTag(status){
  const tag = document.getElementById('statusTag');
  if(!status){ tag.style.display = 'none'; return; }
  tag.style.display = 'inline-block';
  tag.className = 'status-tag ' + (status === 'replied' ? 'replied' : 'open');
  tag.textContent = status === 'replied' ? 'Replied' : 'Open';
}

function setReplyEnabled(enabled){
  document.getElementById('replyInput').disabled = !enabled;
  document.getElementById('replyBtn').disabled = !enabled;
  document.getElementById('replyImageBtn').disabled = !enabled;
  document.getElementById('replyInput').placeholder = enabled ? 'Type a reply...' : 'Waiting for a customer message...';
}

async function findSharedConversation(){
  const { data, error } = await sb
    .from('conversations')
    .select('*')
    .order('created_at', { ascending: true })
    .limit(1)
    .maybeSingle();
  if(error){ console.error(error); return null; }
  return data;
}

async function connectToConversation(){
  const conv = await findSharedConversation();
  if(conv){
    conversationId = conv.id;
    updateStatusTag(conv.status);
    setReplyEnabled(true);
    await loadMessages();
    subscribeMessages();
  } else {
    conversationId = null;
    updateStatusTag(null);
    setReplyEnabled(false);
    document.getElementById('messages').innerHTML = '<div class="empty">Waiting for a customer to start the conversation...</div>';
  }
}

async function loadMessages(){
  const container = document.getElementById('messages');
  container.innerHTML = '<div class="empty">Loading...</div>';
  const { data, error } = await sb
    .from('chat_messages')
    .select('*')
    .eq('conversation_id', conversationId)
    .order('created_at', { ascending: true });

  if(error){
    container.innerHTML = '<div class="empty">Failed to load messages.</div>';
    console.error(error);
    return;
  }
  container.innerHTML = '';
  if(!data.length){
    container.innerHTML = '<div class="empty">No messages yet.</div>';
  } else {
    data.forEach(m => appendMessage(m, false));
  }
  scrollToBottom();
}

function subscribeMessages(){
  if(msgChannel){ sb.removeChannel(msgChannel); msgChannel = null; }
  msgChannel = sb.channel('admin-thread-' + conversationId)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'chat_messages',
      filter: `conversation_id=eq.${conversationId}`
    }, (payload) => {
      appendMessage(payload.new);
    })
    .subscribe();
}

// Watches for the shared conversation being created (first customer message) and for
// status changes on it, so the admin never has to refresh or click into anything.
function subscribeConversationWatch(){
  if(convWatchChannel) return;
  convWatchChannel = sb.channel('admin-conversations')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'conversations' }, async (payload) => {
      if(!conversationId){
        await connectToConversation();
      } else if(payload.new && payload.new.id === conversationId){
        updateStatusTag(payload.new.status);
      }
    })
    .subscribe();
}

// Sending ----------------------------------------------------------------

async function sendReply(){
  if(!conversationId) return;
  const input = document.getElementById('replyInput');
  const text = input.value.trim();
  if(!text) return;

  const btn = document.getElementById('replyBtn');
  btn.disabled = true;

  const { error } = await sb.from('chat_messages').insert({
    conversation_id: conversationId,
    sender: 'admin',
    message: text
  });

  if(error){
    console.error(error);
    btn.disabled = false;
    alert('Failed to send reply.');
    return;
  }

  await sb.from('conversations').update({
    last_message_at: new Date().toISOString(),
    status: 'replied'
  }).eq('id', conversationId);

  input.value = '';
  btn.disabled = false;
  input.focus();
}

async function handleReplyImageSelect(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file || !conversationId) return;
  if(!file.type.startsWith('image/')){
    alert('Please choose an image file.');
    return;
  }
  await sendReplyImage(file);
}

async function sendReplyImage(file){
  const imgBtn = document.getElementById('replyImageBtn');
  const sendBtn = document.getElementById('replyBtn');
  imgBtn.disabled = true;
  sendBtn.disabled = true;

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${conversationId}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

  const { error: uploadError } = await sb.storage.from(IMAGE_BUCKET).upload(path, file, {
    contentType: file.type || 'image/jpeg'
  });

  if(uploadError){
    console.error(uploadError);
    imgBtn.disabled = false;
    sendBtn.disabled = false;
    alert('Image failed to upload. Please try again.');
    return;
  }

  const { data: urlData } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);

  const { error } = await sb.from('chat_messages').insert({
    conversation_id: conversationId,
    sender: 'admin',
    message: '',
    image_url: urlData.publicUrl
  });

  if(error){
    console.error(error);
    imgBtn.disabled = false;
    sendBtn.disabled = false;
    alert('Failed to send image.');
    return;
  }

  await sb.from('conversations').update({
    last_message_at: new Date().toISOString(),
    status: 'replied'
  }).eq('id', conversationId);

  imgBtn.disabled = false;
  sendBtn.disabled = false;
}
</script>
</body></html>
