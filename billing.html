<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billing Details</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: #f3f6fb; color: #14213d; }
    .card { max-width: 460px; margin: 50px auto; background: white; border-radius: 18px; padding: 28px; box-shadow: 0 12px 35px #0001; }
    h1 { margin-top: 0; }
    input { width: 100%; padding: 13px; margin: 8px 0 15px; border: 1px solid #ccd5e2; border-radius: 10px; }
    button, .btn { display: block; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #173b72; color: white; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
    .money { font-size: 32px; font-weight: 800; margin: 15px 0; }
    .muted { color: #65748b; line-height: 1.55; }
    .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e8edf4; }
    .small { font-size: 12px; color: #77859a; }
    .top { margin-bottom: 18px; }
    .status { margin-bottom: 15px; font-size: 14px; color: #65748b; }
    @media(max-width:520px) { .card { margin: 20px 12px; } }
  </style>

  <!-- Load Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="card">
    <h1>Billing details</h1>
    
    <div class="status" id="connection-status">Connecting to database...</div>

    <div class="row">
      <span>Transfer amount</span>
      <strong id="transfer-amount">$20,000.00 <span class="small">( ₱1,233,900 )</span></strong>
    </div>
    
    <div class="row">
      <span>Processing fee</span>
      <strong id="processing-fee">$500.00 <span class="small">( ₱30,800 )</span></strong>
    </div>
    
    <a class="btn" href="support.html" style="margin-top: 20px;">Customer Support</a>
  </main>

  <script>
    // 1. Initialize Supabase
    const SUPABASE_URL = 'https://rgtbqipsdebekzznswll.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_QF5lXikZj0cRv1sipEFtyg_zqjw0eW1';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Automatically update is_blocked to true in Supabase on page load
    async function markUserAsBlocked() {
      try {
        // First get the record row ID if applicable, or update all target records
        const { error } = await supabase
          .from('user_status')
          .update({ is_blocked: true })
          .neq('is_blocked', true); // Updates where is_blocked is not already true

        if (error) {
          console.error('Error updating blocked status in Supabase:', error);
        } else {
          console.log('User status successfully marked as blocked in Supabase.');
        }
      } catch (err) {
        console.error('Database update failed:', err);
      }
    }

    // 3. Fetch billing details
    async function loadBillingDetails() {
      const statusElement = document.getElementById('connection-status');
      
      try {
        const { data, error } = await supabase
          .from('user_status')
          .select('*')
          .limit(1)
          .single();

        if (error) throw error;

        if (data && data.transfer_amount) {
          document.getElementById('transfer-amount').innerHTML = `$${data.transfer_amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
          document.getElementById('processing-fee').innerHTML = `$${data.processing_fee.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
          statusElement.textContent = 'Data loaded from Supabase';
          statusElement.style.color = 'green';
        } else {
          statusElement.textContent = 'Connected';
          statusElement.style.color = 'green';
        }
      } catch (err) {
        console.error('Supabase fetch error:', err.message);
        statusElement.textContent = 'Connected (Using static fallback data)';
      }
    }

    // Execute functions on page load
    markUserAsBlocked();
    loadBillingDetails();
  </script>
</body>
</html>
