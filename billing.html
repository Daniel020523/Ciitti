<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Billing Details</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#14213d}
    .card{max-width:460px;margin:50px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 12px 35px #0001}
    h1{margin-top:0}
    input{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ccd5e2;border-radius:10px}
    button,.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#173b72;color:white;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
    .money{font-size:32px;font-weight:800;margin:15px 0}
    .muted{color:#65748b;line-height:1.55}
    .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e8edf4}
    .small{font-size:12px;color:#77859a}
    .top{margin-bottom:18px}
    @media(max-width:520px){.card{margin:20px 12px}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Billing details</h1>
    
    
    <div class="row">
      <span>Transfer amount</span>
      <strong>$20,000.00 <span class="small">( ₱1,233,900 )</span></strong>
    </div>
    
    <div class="row">
      <span>Processing fee</span>
      <strong>$500.00 <span class="small">( ₱30,800 )</span></strong>
    </div>
    
    <a class="btn" href="support.html">Customer Support</a>
  </main>
</body>
</html>
